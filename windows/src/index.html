<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Clipstar</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; cursor: default; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #menu { position: fixed; display: none; min-width: 190px; padding: 5px; border-radius: 10px; z-index: 5;
            background: rgba(14, 16, 26, .96); border: 1px solid rgba(255, 224, 138, .5); box-shadow: 0 10px 30px rgba(0,0,0,.5);
            font: 13px "Segoe UI", -apple-system, sans-serif; color: #f2f2f6; }
    #menu div { padding: 6px 12px; border-radius: 6px; }
    #menu div:hover { background: rgba(255, 224, 138, .9); color: #000; }
    #menu hr { border: 0; height: 1px; background: rgba(255,255,255,.12); margin: 4px 6px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="menu"></div>
  <script src="main.js"></script>
</body>
</html>
