[package]
name = "clipstar"
version = "0.1.0"
description = "Screenshots and copies docked round the edge of your screen, against the Milky Way"
edition = "2021"

[lib]
name = "clipstar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
clipboard-rs = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
dirs = "5"
trash = "5"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Security_Credentials_UI", "Foundation", "Win32_Foundation", "Win32_System_WinRT"] }
